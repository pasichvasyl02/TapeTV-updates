name: Publish prepared TapeTV release

on:
  push:
    branches: [main]
    paths: [.release-upload/request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tapetv-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the prepared release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Decode and verify the original signed APK
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          request = json.loads(pathlib.Path('.release-upload/request.json').read_text())
          version = request['versionCode']
          assert type(version) is int and 0 < version < 1000000
          folder = pathlib.Path('.release-upload') / ('v' + str(version))
          manifest = json.loads((folder / 'latest.json').read_text())
          assert manifest['packageName'] == 'ua.tapetv.preview'
          assert manifest['versionCode'] == version
          name = 'TapeTV_v' + str(version) + '.apk'
          assert manifest['apk'] == name
          count = request['parts']
          assert type(count) is int and 1 <= count <= 100
          encoded = ''.join((folder / ('apk.part%03d.b64' % i)).read_text() for i in range(count))
          apk = base64.b64decode(encoded, validate=True)
          assert len(apk) == manifest['size']
          digest = hashlib.sha256(apk).hexdigest()
          assert digest == manifest['sha256'] == request['sha256']
          output = pathlib.Path('release-assets')
          output.mkdir()
          (output / name).write_bytes(apk)
          (output / 'latest.json').write_bytes((folder / 'latest.json').read_bytes())
          (output / 'notes.md').write_text(request['notes'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=v%d\n' % version)
              env.write('RELEASE_APK=release-assets/%s\n' % name)
          print('Verified signed APK:', name, len(apk), digest)
          PY
      - name: Publish APK and updater manifest as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo 'This release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_APK" release-assets/latest.json \
            --target "$RELEASE_COMMIT" --title "TapeTV $RELEASE_TAG" \
            --notes-file release-assets/notes.md --latest
          gh release view "$RELEASE_TAG" --json url,tagName,assets
